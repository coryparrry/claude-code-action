name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun --no-env-file install --frozen-lockfile

      - name: Run tests
        run: bun --no-env-file test

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun --no-env-file install --frozen-lockfile

      - name: Run prettier check
        run: bun --no-env-file run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun --no-env-file install --frozen-lockfile

      - name: Run TypeScript type check
        run: |
          bun --no-env-file run typecheck
          cd base-action
          bun --no-env-file run typecheck

  production-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Verify isolated production installs and offline SDK execution
        run: bun --no-env-file scripts/verify-action-package.mjs
