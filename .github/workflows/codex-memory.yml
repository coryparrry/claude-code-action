# Managed by the Codex GitHub Action installer.
name: Codex memory

on:
  workflow_run:
    workflows: [Codex]
    types: [completed]
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  memory:
    if: >-
      github.repository == 'coryparrry/claude-code-action' && (
      (github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        contains(fromJSON('["coryparrry"]'), github.event.workflow_run.actor.login)) ||
      (github.event_name == 'pull_request_target' &&
        github.event.action == 'closed' &&
        github.event.pull_request.head.repo.full_name == github.repository))
    permissions:
      contents: write
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: coryparrry/claude-code-action/review-memory@8124d92dee8a03455fb16b024b430bc9f9135c63
        with:
          github_token: ${{ github.token }}
          trusted_actors: "coryparrry"
