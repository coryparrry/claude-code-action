name: Live request verification
on:
  pull_request:
    types: [opened, synchronize, labeled]
permissions:
  contents: read
jobs:
  fixture-check:
    if: github.head_ref == 'codex/live-request-workflows' && github.event.action != 'labeled'
    name: Live request fixture CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun --no-env-file test test/fixtures/live-request/normalize.test.ts
  verify:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'codex-live-verify' &&
      github.actor == 'coryparrry' && github.head_ref == 'codex/live-request-workflows' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-firewall
    timeout-minutes: 35
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      LIVE_PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Prepare actual GitHub event snapshots
        run: node scripts/live-request-fixture.mjs prepare
      - name: Implement actual inline reply
        id: inline
        uses: ./
        env:
          LIVE_EVENT_NAME: pull_request_review_comment
          LIVE_EVENT_PATH: ${{ runner.temp }}/live-inline.json
        with:
          path_to_bun_executable: ${{ runner.temp }}/live-bun
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          trigger_phrase: /verify-codex
          codex_model: gpt-6.1-terra
          codex_effort: max
          allowed_tools: Write(.git/codex-commit-message.txt),Write(test/fixtures/live-request/**),Edit(test/fixtures/live-request/**),Bash(bun --no-env-file test test/fixtures/live-request/normalize.test.ts:*)
          claude_args: --permission-mode auto --no-session-persistence
          max_turns: "25"
      - name: Verify pushed inline fix and passing regression
        env:
          LIVE_CONCLUSION: ${{ steps.inline.outputs.conclusion }}
          LIVE_REPORT: ${{ steps.inline.outputs.execution_file }}
        run: node "$RUNNER_TEMP/live-request-fixture.mjs" inline
      - name: Save live reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-request-reports-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/live-*-report.json
            ${{ runner.temp }}/codex-execution-output.json
          if-no-files-found: warn
          retention-days: 7
