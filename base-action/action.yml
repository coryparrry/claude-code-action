name: "Codex Base Action"
description: "Run OpenAI Codex against an inline or file prompt"
branding:
  icon: "terminal"
  color: "orange"

inputs:
  prompt:
    description: "Inline prompt; specify exactly one of prompt or prompt_file"
    required: false
    default: ""
  prompt_file:
    description: "Path to a non-empty prompt file"
    required: false
    default: ""
  openai_api_key:
    description: "OpenAI API key used by Codex"
    required: true
  codex_model:
    description: "OpenAI model used by the Agents SDK; defaults to gpt-6.1-sol"
    required: false
    default: ""
  codex_effort:
    description: "Optional reasoning effort: none, minimal, low, medium, high, or xhigh"
    required: false
    default: ""
  codex_sandbox:
    description: "Codex sandbox: read-only or workspace-write"
    required: false
    default: "workspace-write"
  codex_timeout_minutes:
    description: "Positive integer timeout for the agent run"
    required: false
    default: "30"
  mcp_config:
    description: "JSON object with stdio or streamable HTTP mcpServers"
    required: false
    default: '{"mcpServers":{}}'
  append_system_prompt:
    description: "Additional instructions appended to the prompt"
    required: false
    default: ""
  path_to_bun_executable:
    description: "Use an existing Bun executable instead of installing Bun"
    required: false
    default: ""
  show_full_output:
    description: "Show redacted Codex events in the Actions log"
    required: false
    default: "false"

  codex_args:
    description: "Codex and supported legacy CLI arguments"
    required: false
    default: ""
  claude_args:
    description: "Compatibility alias for codex_args"
    required: false
    default: ""
  settings:
    description: "Codex configuration or supported legacy settings"
    required: false
    default: ""
  plugins:
    description: "Newline-separated Codex plugin names"
    required: false
    default: ""
  plugin_marketplaces:
    description: "Newline-separated Codex plugin marketplace sources"
    required: false
    default: ""

  max_turns:
    description: "Maximum model turns before execution fails"
    required: false
    default: ""
  max_budget_usd:
    description: "Maximum estimated API cost in USD before execution fails"
    required: false
    default: ""
  allowed_tools:
    description: "Comma-separated allowed tool rules"
    required: false
    default: ""
  disallowed_tools:
    description: "Comma-separated denied tool rules"
    required: false
    default: ""
  system_prompt:
    description: "Replacement trusted system instructions"
    required: false
    default: ""
  fallback_model:
    description: "Fallback model for eligible API failures"
    required: false
    default: ""
  additional_directories:
    description: "Newline-separated additional workspace directories"
    required: false
    default: ""
  setting_sources:
    description: "Comma-separated settings sources: user, project, local"
    required: false
    default: ""
  permission_mode:
    description: "Tool permission mode for this unattended run"
    required: false
    default: ""
  continue_session:
    description: "Continue the latest saved session when true"
    required: false
    default: ""
  resume_session:
    description: "Saved session ID to resume"
    required: false
    default: ""
  use_node_cache:
    description: "Enable the Node npm cache when true"
    required: false
    default: "false"

outputs:
  conclusion:
    description: "Execution status: success or failure"
    value: ${{ steps.run_codex.outputs.conclusion }}
  execution_file:
    description: "Path to the redacted JSON execution report"
    value: ${{ steps.run_codex.outputs.execution_file }}
  structured_output:
    description: "JSON result when an output schema is supplied"
    value: ${{ steps.run_codex.outputs.structured_output }}
  session_id:
    description: "Agent session ID for report correlation or explicit resume"
    value: ${{ steps.run_codex.outputs.session_id }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ env.NODE_VERSION || '18.x' }}
        cache: ${{ inputs.use_node_cache == 'true' && 'npm' || '' }}
        package-manager-cache: false
    - name: Install Bun
      if: inputs.path_to_bun_executable == ''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.2
        no-cache: true
    - name: Setup custom Bun path
      if: inputs.path_to_bun_executable != ''
      shell: bash
      env:
        BUN_EXECUTABLE: ${{ inputs.path_to_bun_executable }}
      run: |
        echo "$(dirname "$BUN_EXECUTABLE")" >> "$GITHUB_PATH"
    - name: Install dependencies
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        bun install --production --frozen-lockfile
    - name: Run Codex
      id: run_codex
      shell: bash
      run: |
        if [ -n "$CODEX_WORKING_DIR" ]; then
          cd "$CODEX_WORKING_DIR"
        fi
        bun --no-env-file --config="$GITHUB_ACTION_PATH/bunfig.toml" run "$GITHUB_ACTION_PATH/src/index.ts"
      env:
        INPUT_CODEX_ARGS: ${{ inputs.codex_args }}
        INPUT_CLAUDE_ARGS: ${{ inputs.claude_args }}
        INPUT_SETTINGS: ${{ inputs.settings }}
        INPUT_PLUGINS: ${{ inputs.plugins }}
        INPUT_PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
        INPUT_PROMPT: ${{ inputs.prompt }}
        INPUT_PROMPT_FILE: ${{ inputs.prompt_file }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        INPUT_ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        INPUT_DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        INPUT_SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        INPUT_FALLBACK_MODEL: ${{ inputs.fallback_model }}
        INPUT_ADDITIONAL_DIRECTORIES: ${{ inputs.additional_directories }}
        INPUT_SETTING_SOURCES: ${{ inputs.setting_sources }}
        INPUT_PERMISSION_MODE: ${{ inputs.permission_mode }}
        INPUT_CONTINUE_SESSION: ${{ inputs.continue_session }}
        INPUT_RESUME_SESSION: ${{ inputs.resume_session }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        INPUT_CODEX_MODEL: ${{ inputs.codex_model }}
        INPUT_CODEX_EFFORT: ${{ inputs.codex_effort }}
        INPUT_CODEX_SANDBOX: ${{ inputs.codex_sandbox }}
        INPUT_CODEX_TIMEOUT_MINUTES: ${{ inputs.codex_timeout_minutes }}
        INPUT_MCP_CONFIG: ${{ inputs.mcp_config }}
        INPUT_APPEND_SYSTEM_PROMPT: ${{ inputs.append_system_prompt }}
        INPUT_SHOW_FULL_OUTPUT: ${{ inputs.show_full_output }}
