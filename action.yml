name: "Codex GitHub Action"
description: "Run Codex on GitHub issues, PR reviews, and custom prompts; fork PRs are disabled."
branding:
  icon: "at-sign"
  color: "blue"

inputs:
  openai_api_key:
    description: "OpenAI API key; defaults to the OPENAI_API_KEY environment variable"
    required: false
  openai_provider:
    description: "OpenAI API provider: openai, bedrock or azure"
    required: false
    default: ""
  openai_identity_provider_id:
    description: "OpenAI workload identity provider ID (requires id-token: write)"
    required: false
    default: ""
  openai_service_account_id:
    description: "OpenAI workload identity mapped service account ID"
    required: false
    default: ""
  openai_oidc_audience:
    description: "Audience configured for the OpenAI workload identity provider"
    required: false
    default: ""
  bedrock_api_key:
    description: "AWS Bedrock bearer token for OpenAI models; region comes from AWS_REGION"
    required: false
    default: ""
  azure_openai_endpoint:
    description: "Azure OpenAI endpoint for the selected deployment"
    required: false
    default: ""
  azure_openai_api_key:
    description: "Azure OpenAI API key (alternative to Azure AD token)"
    required: false
    default: ""
  azure_openai_ad_token:
    description: "Azure AD token for Azure OpenAI (alternative to API key)"
    required: false
    default: ""
  codex_model:
    description: "OpenAI model used by the Agents SDK; defaults to gpt-6-luna"
    required: false
    default: ""
  codex_effort:
    description: "Optional Codex reasoning effort"
    required: false
    default: ""
  codex_sandbox:
    description: "Tool and file access policy: read-only or workspace-write; does not provide OS process isolation"
    required: false
    default: "workspace-write"
  trigger_phrase:
    description: "The trigger phrase to look for in comments or issue body"
    required: false
    default: "/codex"
  assignee_trigger:
    description: "The assignee username that triggers the action (e.g. @your-bot)"
    required: false
  label_trigger:
    description: "The label that triggers the action (e.g. codex)"
    required: false
    default: "codex"
  base_branch:
    description: "The branch to use as the base/source when creating new branches (defaults to repository default branch)"
    required: false
  branch_prefix:
    description: "Prefix for branches created by Codex"
    required: false
    default: "codex/"
  branch_name_template:
    description: "Template for branch naming. Available variables: {{prefix}}, {{entityType}}, {{entityNumber}}, {{timestamp}}, {{sha}}, {{label}}, {{description}}. {{label}} will be first label from the issue/PR, or {{entityType}} as a fallback. {{description}} will be the first 5 words of the issue/PR title in kebab-case. Default: '{{prefix}}{{entityType}}-{{entityNumber}}-{{timestamp}}'"
    required: false
    default: ""
  allowed_bots:
    description: "Comma-separated list of allowed bot usernames, or '*' to allow all bots. Empty string (default) allows no bots. WARNING: On public repos with '*', external Apps may be able to invoke this action with prompts they control. See SECURITY.md."
    required: false
    default: ""
  include_comments_by_actor:
    description: "Comma-separated list of actor usernames to INCLUDE in comments. Supports wildcards: '*[bot]' matches all bots, 'dependabot[bot]' matches specific bot. Empty (default) includes all actors."
    required: false
    default: ""
  exclude_comments_by_actor:
    description: "Comma-separated list of actor usernames to EXCLUDE from comments. Supports wildcards: '*[bot]' matches all bots, 'renovate[bot]' matches specific bot. Empty (default) excludes none. If actor is in both lists, exclusion takes priority."
    required: false
    default: ""
  prompt:
    description: "Instructions for Codex. Can be a direct prompt or custom template."
    required: false
    default: ""
  github_app_id:
    description: "GitHub App ID used to mint repository-scoped installation tokens"
    required: false
    default: ""
  github_app_private_key:
    description: "GitHub App private key, stored as a repository secret"
    required: false
    default: ""
  github_app_installation_id:
    description: "Optional GitHub App installation ID; resolved from current repository when omitted"
    required: false
    default: ""
  github_token:
    description: "Optional repository token; defaults to the workflow GitHub token"
    required: false
  use_sticky_comment:
    description: "Reuse one tracking comment for pull_request and pull_request_target workflows"
    required: false
    default: "false"
  use_commit_signing:
    description: "Enable commit signing using GitHub's commit signature verification. When false, Codex uses standard git commands"
    required: false
    default: "false"
  ssh_signing_key:
    description: "SSH private key for signing commits. When provided, git will be configured to use SSH signing. Takes precedence over use_commit_signing."
    required: false
    default: ""
  bot_id:
    description: "GitHub bot user ID for git operations"
    required: false
    default: "41898282"
  bot_name:
    description: "GitHub username for git operations and sticky comments with a custom token"
    required: false
    default: ""
  track_progress:
    description: "Force tag mode with tracking comments for pull_request and issue events. Only applicable to pull_request (opened, synchronize, ready_for_review, reopened, labeled) and issue (opened, edited, labeled, assigned) events."
    required: false
    default: "false"
  path_to_bun_executable:
    description: "Optional path to a custom Bun executable. If provided, skips automatic Bun installation and uses this executable instead. WARNING: Using an incompatible version may cause problems if the action requires specific Bun features. This input is typically not needed unless you're debugging something specific or have unique needs in your environment."
    required: false
    default: ""
  display_report:
    description: "Whether to display the Codex Report in GitHub Step Summary. Set to 'false' to disable when using custom formatting solutions. WARNING: This outputs Codex-authored content in the GitHub Step Summary. This should only be used in cases where the action is used solely with trusted input."
    required: false
    default: "false"
  show_full_output:
    description: "Show full JSON output from Codex. WARNING: This outputs ALL Codex messages including tool execution results which may contain secrets, API keys, or other sensitive information. These logs are publicly visible in GitHub Actions. Only enable for debugging in non-sensitive environments."
    required: false
    default: "false"
  buffer_inline_comments:
    description: "Queue inline comments until execution finishes; confirmed=false comments are discarded"
    required: false
    default: "true"

  allowed_non_write_users:
    description: |
      Comma-separated list of usernames to allow without write permissions, or '*' to allow all users.
      Only works when github_token input is provided. WARNING: Use with extreme caution - this
      bypasses security checks and should only be used for workflows with very limited permissions
      (e.g., issue labeling).

      SECURITY: Processing untrusted content exposes the workflow to prompt injection. When this
      input is set, Codex does a best-effort scrub of OpenAI and GitHub Actions secrets
      from subprocess environments. This reduces but does not eliminate prompt injection risk -
      only use for workflows with very limited permissions and validate all outputs.
    required: false
    default: ""

  settings:
    description: "Codex configuration as TOML/JSON or a file, plus supported legacy model/permissions settings"
    required: false
    default: ""

  claude_args:
    description: "Compatibility arguments from existing Claude Action workflows, adapted to Codex; codex_args takes precedence"
    required: false
    default: ""

  additional_permissions:
    description: "Legacy GitHub permission hints; grant these in the calling workflow permissions or supplied token"
    required: false
    default: ""

  classify_inline_comments:
    description: "Buffer inline comments without confirmed=true and classify them (real review vs test/probe) before posting after the session ends. Set to 'false' to post all inline comments immediately (pre-buffering behavior)."
    required: false
    default: "true"

  include_fix_links:
    description: "Include links to affected PR changes with fix context in review feedback"
    required: false
    default: "false"

  plugins:
    description: "Newline-separated Codex plugin names (plugin@marketplace); plugins must use Codex manifests"
    required: false
    default: ""

  plugin_marketplaces:
    description: "Newline-separated Codex plugin marketplace sources"
    required: false
    default: ""

  codex_args:
    description: "Codex arguments; supported legacy CLI options are translated without a shell"
    required: false
    default: ""

  max_turns:
    description: "Maximum model turns before execution fails"
    required: false
    default: ""
  max_budget_usd:
    description: "Maximum estimated API cost in USD before execution fails"
    required: false
    default: ""
  allowed_tools:
    description: "Comma-separated allowed tool rules"
    required: false
    default: ""
  disallowed_tools:
    description: "Comma-separated denied tool rules"
    required: false
    default: ""
  system_prompt:
    description: "Replacement trusted system instructions"
    required: false
    default: ""
  fallback_model:
    description: "Fallback model for eligible API failures"
    required: false
    default: ""
  additional_directories:
    description: "Newline-separated additional workspace directories"
    required: false
    default: ""
  setting_sources:
    description: "Comma-separated settings sources: user, project, local"
    required: false
    default: ""
  permission_mode:
    description: "Tool permission mode for this unattended run"
    required: false
    default: ""
  continue_session:
    description: "Continue the latest saved session when true"
    required: false
    default: ""
  resume_session:
    description: "Saved session ID to resume"
    required: false
    default: ""
  use_node_cache:
    description: "Enable the Node npm cache when true"
    required: false
    default: "false"
  append_system_prompt:
    description: "Additional trusted system instructions"
    required: false
    default: ""

outputs:
  skipped_due_to_fork:
    description: "True when execution was skipped because the request targets a fork PR"
    value: ${{ steps.run.outputs.skipped_due_to_fork }}
  conclusion:
    description: "Codex execution status: success or failure"
    value: ${{ steps.run.outputs.conclusion }}
  execution_file:
    description: "Path to the Codex execution report"
    value: ${{ steps.run.outputs.execution_file }}
  branch_name:
    description: "The branch used or created by Codex"
    value: ${{ steps.run.outputs.branch_name }}
  github_token:
    description: "The GitHub token used by the action"
    value: ${{ steps.run.outputs.github_token }}
  github_app_token_created:
    description: "Whether this run minted a GitHub App installation token (used for final cleanup)"
    value: ${{ steps.run.outputs.github_app_token_created }}
  structured_output:
    description: "JSON result produced when an output schema is supplied"
    value: ${{ steps.run.outputs.structured_output }}
  session_id:
    description: "Agent session identifier for explicit resume"
    value: ${{ steps.run.outputs.session_id }}

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ env.NODE_VERSION || '22.x' }}
        cache: ${{ inputs.use_node_cache == 'true' && 'npm' || '' }}
        package-manager-cache: false
    - name: Install Bun
      id: setup-bun
      if: inputs.path_to_bun_executable == ''
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # https://github.com/oven-sh/setup-bun/releases/tag/v2.2.0
      with:
        bun-version: 1.4.2
        token: ${{ inputs.github_token || github.token }}
        # Disable setup-bun's cache. The upstream save step uses a deterministic
        # key (Bun version) and isn't ref-aware: on every second-and-subsequent
        # run against the same PR ref the GitHub cache API rejects the duplicate
        # key+ref with a 409 (HTML body), and @actions/cache treats the unparsable
        # response as transient and burns ~20-30s on 5 retries before warning.
        # The 35 MB Bun binary downloads in 2-3s, so disabling the cache is a net
        # wallclock win and removes the noisy warning. See issue #1252.
        no-cache: true

    - name: Setup Custom Bun Path
      if: inputs.path_to_bun_executable != ''
      shell: bash
      env:
        PATH_TO_BUN_EXECUTABLE: ${{ inputs.path_to_bun_executable }}
      run: |
        echo "Using custom Bun executable: $PATH_TO_BUN_EXECUTABLE"
        # Add the directory containing the custom executable to PATH
        BUN_DIR=$(dirname "$PATH_TO_BUN_EXECUTABLE")
        echo "$BUN_DIR" >> "$GITHUB_PATH"

    - name: Install Dependencies
      shell: bash
      env:
        BUN_EXECUTABLE: ${{ inputs.path_to_bun_executable || 'bun' }}
      run: |
        cd "$GITHUB_ACTION_PATH"
        "$BUN_EXECUTABLE" --no-env-file install --production --frozen-lockfile

    - name: Run Codex Action
      id: run
      shell: bash
      run: |
        # Do NOT pass --tsconfig-override here. It triggers a Bun runtime bug
        # ("Internal error: directory mismatch for directory .../tsconfig.json")
        # that aborts the run with exit code 1. Bun already auto-discovers the
        # action's own tsconfig.json by walking up from the entry file, so the
        # override is redundant. See oven-sh/bun#25730.
        "$BUN_EXECUTABLE" --no-env-file \
          --config="${GITHUB_ACTION_PATH}/bunfig.toml" \
          run "${GITHUB_ACTION_PATH}/src/entrypoints/run.ts"
      env:
        BUN_EXECUTABLE: ${{ inputs.path_to_bun_executable || 'bun' }}
        PROMPT: ${{ inputs.prompt }}
        TRIGGER_PHRASE: ${{ inputs.trigger_phrase }}
        ASSIGNEE_TRIGGER: ${{ inputs.assignee_trigger }}
        LABEL_TRIGGER: ${{ inputs.label_trigger }}
        BASE_BRANCH: ${{ inputs.base_branch }}
        BRANCH_PREFIX: ${{ inputs.branch_prefix }}
        BRANCH_NAME_TEMPLATE: ${{ inputs.branch_name_template }}
        GITHUB_TOKEN_PROVIDED: ${{ inputs.github_token != '' || inputs.github_app_id != '' || env.GITHUB_APP_ID != '' }}
        OVERRIDE_GITHUB_TOKEN: ${{ inputs.github_token }}
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_APP_ID: ${{ inputs.github_app_id || env.GITHUB_APP_ID }}
        GITHUB_APP_PRIVATE_KEY: ${{ inputs.github_app_private_key || env.GITHUB_APP_PRIVATE_KEY }}
        GITHUB_APP_INSTALLATION_ID: ${{ inputs.github_app_installation_id || env.GITHUB_APP_INSTALLATION_ID }}
        ALLOWED_NON_WRITE_USERS: ${{ inputs.allowed_non_write_users }}
        CLAUDE_ARGS: ${{ inputs.claude_args }}
        CODEX_ARGS: ${{ inputs.codex_args }}
        INPUT_SETTINGS: ${{ inputs.settings }}
        INPUT_PLUGINS: ${{ inputs.plugins }}
        INPUT_PLUGIN_MARKETPLACES: ${{ inputs.plugin_marketplaces }}
        ADDITIONAL_PERMISSIONS: ${{ inputs.additional_permissions }}
        CLASSIFY_INLINE_COMMENTS: ${{ inputs.classify_inline_comments }}
        INCLUDE_FIX_LINKS: ${{ inputs.include_fix_links }}
        ALLOWED_BOTS: ${{ inputs.allowed_bots }}
        INCLUDE_COMMENTS_BY_ACTOR: ${{ inputs.include_comments_by_actor }}
        EXCLUDE_COMMENTS_BY_ACTOR: ${{ inputs.exclude_comments_by_actor }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        USE_STICKY_COMMENT: ${{ inputs.use_sticky_comment }}
        BUFFER_INLINE_COMMENTS: ${{ inputs.buffer_inline_comments }}
        DEFAULT_WORKFLOW_TOKEN: ${{ github.token }}
        USE_COMMIT_SIGNING: ${{ inputs.use_commit_signing }}
        SSH_SIGNING_KEY: ${{ inputs.ssh_signing_key }}
        BOT_ID: ${{ inputs.bot_id }}
        BOT_NAME: ${{ inputs.bot_name || 'github-actions[bot]' }}
        TRACK_PROGRESS: ${{ inputs.track_progress }}
        ALL_INPUTS: ${{ toJson(inputs) }}
        MAX_TURNS: ${{ inputs.max_turns }}
        MAX_BUDGET_USD: ${{ inputs.max_budget_usd }}
        ALLOWED_TOOLS: ${{ inputs.allowed_tools }}
        DISALLOWED_TOOLS: ${{ inputs.disallowed_tools }}
        SYSTEM_PROMPT: ${{ inputs.system_prompt }}
        FALLBACK_MODEL: ${{ inputs.fallback_model }}
        ADDITIONAL_DIRECTORIES: ${{ inputs.additional_directories }}
        SETTING_SOURCES: ${{ inputs.setting_sources }}
        PERMISSION_MODE: ${{ inputs.permission_mode }}
        CONTINUE_SESSION: ${{ inputs.continue_session }}
        RESUME_SESSION: ${{ inputs.resume_session }}
        APPEND_SYSTEM_PROMPT: ${{ inputs.append_system_prompt }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key || env.OPENAI_API_KEY }}
        OPENAI_PROVIDER: ${{ inputs.openai_provider || env.OPENAI_PROVIDER }}
        OPENAI_IDENTITY_PROVIDER_ID: ${{ inputs.openai_identity_provider_id || env.OPENAI_IDENTITY_PROVIDER_ID }}
        OPENAI_SERVICE_ACCOUNT_ID: ${{ inputs.openai_service_account_id || env.OPENAI_SERVICE_ACCOUNT_ID }}
        OPENAI_OIDC_AUDIENCE: ${{ inputs.openai_oidc_audience || env.OPENAI_OIDC_AUDIENCE }}
        AWS_BEARER_TOKEN_BEDROCK: ${{ inputs.bedrock_api_key || env.AWS_BEARER_TOKEN_BEDROCK }}
        AZURE_OPENAI_ENDPOINT: ${{ inputs.azure_openai_endpoint || env.AZURE_OPENAI_ENDPOINT }}
        AZURE_OPENAI_API_KEY: ${{ inputs.azure_openai_api_key || env.AZURE_OPENAI_API_KEY }}
        AZURE_OPENAI_AD_TOKEN: ${{ inputs.azure_openai_ad_token || env.AZURE_OPENAI_AD_TOKEN }}
        CODEX_MODEL: ${{ inputs.codex_model }}
        CODEX_EFFORT: ${{ inputs.codex_effort }}
        CODEX_SANDBOX: ${{ inputs.codex_sandbox }}
        INPUT_PROMPT_FILE: ${{ runner.temp }}/codex-prompts/codex-prompt.txt
        INPUT_SHOW_FULL_OUTPUT: ${{ inputs.show_full_output }}
        DISPLAY_REPORT: ${{ inputs.display_report }}

    - name: Cleanup SSH signing key
      if: always() && inputs.ssh_signing_key != ''
      shell: bash
      env:
        BUN_EXECUTABLE: ${{ inputs.path_to_bun_executable || 'bun' }}
      run: |
        # No --tsconfig-override: see the "Run Codex Action" step above.
        "$BUN_EXECUTABLE" --no-env-file \
          --config="${GITHUB_ACTION_PATH}/bunfig.toml" \
          run "${GITHUB_ACTION_PATH}/src/entrypoints/cleanup-ssh-signing.ts"

    - name: Revoke GitHub App installation token
      if: always() && steps.run.outputs.github_app_token_created == 'true'
      shell: bash
      env:
        BUN_EXECUTABLE: ${{ inputs.path_to_bun_executable || 'bun' }}
        GITHUB_APP_TOKEN_CREATED: ${{ steps.run.outputs.github_app_token_created }}
        MINTED_GITHUB_APP_TOKEN: ${{ steps.run.outputs.github_token }}
      run: |
        "$BUN_EXECUTABLE" --no-env-file \
          --config="${GITHUB_ACTION_PATH}/bunfig.toml" \
          run "${GITHUB_ACTION_PATH}/src/entrypoints/revoke-app-token.ts"
